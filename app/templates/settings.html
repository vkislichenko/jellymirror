{% extends "base.html" %}
{% block body %}
<h1>Settings</h1>
<form method="post" action="/settings" class="card">
  <div class="grid">
    <div><label>Check titles for new files every (s)</label><input name="lib_poll_seconds" type="number" value="{{ values.lib_poll_seconds }}"></div>
    <div><label>Check watch state every (s)</label><input name="watch_poll_seconds" type="number" value="{{ values.watch_poll_seconds }}"></div>
    <div><label>Full check of everything every (hours)</label><input name="reconcile_hours" type="number" step="0.5" value="{{ values.reconcile_hours }}"></div>
    <div><label>Transfers at once</label><input name="max_parallel_jobs" type="number" value="{{ values.max_parallel_jobs }}"></div>
  </div>
  <label>Default series template</label><input name="series_template" value="{{ values.series_template }}">
  <label>Default movie template</label><input name="movie_template" value="{{ values.movie_template }}">
  <p><button>Save</button></p>
</form>
<div class="card"><h2 style="margin-top:0">SSH public key</h2><pre>{{ pubkey }}</pre></div>
{% endblock %}
